<div class="category-summary">
  <table class="category-table">
    <thead>
      <tr>
        {% for cat in category_summary %}
        <th class="cat-head cat-{{ cat.name|lower }}">{{ cat.name }}</th>
        <th class="cat-head cat-{{ cat.name|lower }}">Status</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      <tr>
        {% for cat in category_summary %}
        <td class="{% if cat.overdue %}overdue{% endif %}" title="{{ 'Ada pekerjaan yang melewati Due Date' if cat.overdue else '' }}">
          <a href="{{ url_for('progress', category=cat.name, month=month, year=selected_year) }}" class="cat-link">{{ cat.count }}</a>
        </td>
        <td class="{% if cat.status == 'Close' %}status-close{% endif %}{% if cat.overdue %} overdue{% endif %}" title="{{ 'Ada pekerjaan yang melewati Due Date' if cat.overdue else '' }}">
          <a href="{{ url_for('progress', category=cat.name, month=month, year=selected_year) }}" class="cat-link">{{ cat.status }}</a>
        </td>
        {% endfor %}
      </tr>
    </tbody>
  </table>
</div>
